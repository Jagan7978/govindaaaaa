    <style>
        * {

        body {

            display: flex;

        .container {

            padding: 6px 16px;

            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(255, 0, 85, 0.3);
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .highlight {
            color: #0088cc;
            background: -webkit-linear-gradient(45deg, #0088cc, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 20px;
        }

        .features {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
            text-align: left;
        }

        .feature-item:last-child {

        }

        .feature-item i {

            font-size: 16px;

        .timer-box {
            background: rgba(0, 136, 204, 0.1);
            border: 1px solid rgba(0, 136, 204, 0.3);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 20px;
        }

        .timer-text {
            font-size: 12px;
            color: #00d2ff;
            margin-bottom: 5px;
        }

        #timer {
            font-size: 22px;

        .btn-telegram {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(45deg, #0088cc, #00a8ff);
            color: white;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.6);
            transition: all 0.3s ease;
            animation: pulse 1.8s infinite;
        }

        .btn-telegram:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 136, 204, 0.9);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 136, 204, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(0, 136, 204, 0);
            }
            100% {

        <div class="features">

        </div>
    </div>

    <script>
        // Countdown Timer Script
        let timeInSeconds = 120; // 2 minutes
        const timerElement = document.getElementById('timer');

        function updateTimer() {
            const minutes = Math.floor(timeInSeconds / 60);
            const seconds = timeInSeconds % 60;
            
            timerElement.textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            if (timeInSeconds > 0) {
                timeInSeconds--;
            } else {
                timeInSeconds = 120; // Reset loop
            }
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
